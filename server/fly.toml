# Deploy: fly launch --name counselview-api
# Set secret: fly secrets set ANTHROPIC_API_KEY=sk-ant-...

app = "counselview-api"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  ALLOWED_ORIGIN = "*"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
